name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rokit
        uses: paradoxum-games/setup-rokit@v3
        with:
          version: 1.2.0
          cache: true

      - name: Install packages
        run: |
          wally install
          git diff --exit-code -- wally.lock

      - name: Check formatting
        run: stylua --check src tests

      - name: Lint
        run: selene src tests

      - name: Build Rojo project
        run: rojo build default.project.json -o ProWrestlingLeagues.rbxlx

      - name: Build test place
        run: rojo build test.project.json -o ProWrestlingLeaguesTests.rbxlx
