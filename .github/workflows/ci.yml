name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned tools
        uses: paradoxum-games/setup-rokit@29e6ee09651a3711e3a287a1037671d7b74db6d0 # v3
        with:
          version: 1.2.0
          cache: true

      - name: Install packages and verify lockfile
        run: |
          wally install
          git diff --exit-code -- wally.lock

      - name: Check formatting
        run: stylua --check src tests

      - name: Lint
        run: selene src tests

      - name: Validate Studio runner scripts
        shell: pwsh
        run: |
          foreach ($scriptFile in Get-ChildItem tests -Filter '*.ps1') {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptFile.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -ne 0) {
              throw "Invalid PowerShell in $($scriptFile.Name): $parseErrors"
            }
          }

      - name: Type check all runtime source
        run: |
          rojo sourcemap default.project.json --include-non-scripts -o sourcemap.json
          curl -fsSL https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.70.0/scripts/globalTypes.d.luau -o "$RUNNER_TEMP/robloxTypes.d.luau"
          echo "2b0df788dc3fd1b572e71ee7fe9e1c55cc23882afbd5024aecdec30d9bd7520f  $RUNNER_TEMP/robloxTypes.d.luau" | sha256sum --check
          luau-lsp analyze --platform roblox --sourcemap sourcemap.json \
            --definitions "@roblox=$RUNNER_TEMP/robloxTypes.d.luau" src

      - name: Build game, unit, and multiplayer projects
        run: |
          rojo build default.project.json -o ProWrestlingLeagues.rbxlx
          rojo build test.project.json -o ProWrestlingLeaguesTests.rbxlx
          rojo build integration.project.json -o ProWrestlingLeaguesIntegrationTests.rbxlx
